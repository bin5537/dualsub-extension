<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      /* 묶음 목록·시트 같은 뼈대는 iOS 설정을 따르되 색은 b1n2da 것을 쓴다.
         애플 팔레트를 그대로 쓰면 어느 앱에서 떼어 온 화면처럼 보인다. */
      :root {
        color-scheme: light dark;
        --bg: #f4f5f7;
        --card: #ffffff;
        --sep: #e8eaed;
        --label: #191b1e;
        --secondary: #6b7178;
        --tertiary: #979ca3;
        --fill: #f1f2f4;
        --fill-strong: #e0e3e7;
        --accent: #059669;
        --green: #059669;
        --sheet: #f4f5f7;
        --thumb: #ffffff;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      }
      /* 시스템이 어두우면 따라가되, 사용자가 밝게로 고정했으면 무시한다. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #131418;
          --card: #191a1f;
          --sep: #26272d;
          --label: #ececef;
          --secondary: #9a9ea8;
          --tertiary: #6b6f78;
          --fill: #23242a;
          --fill-strong: #34363e;
          --accent: #34d399;
          --green: #34d399;
          --sheet: #17181d;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }
      }
      /* 어둡게로 고정한 경우 — 시스템 설정과 무관하게 적용된다. */
      :root[data-theme="dark"] {
        --bg: #131418;
        --card: #191a1f;
        --sep: #26272d;
        --label: #ececef;
        --secondary: #9a9ea8;
        --tertiary: #6b6f78;
        --fill: #23242a;
        --fill-strong: #34363e;
        --accent: #34d399;
          --green: #34d399;
        --sheet: #17181d;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
      }
      body {
        position: relative;
        width: 344px;
        min-height: 360px;
        margin: 0;
        padding: 0 0 10px;
        background: var(--bg);
        color: var(--label);
        /* 확장 페이지는 CSP 때문에 웹폰트를 받아올 수 없다. 설치돼 있으면 쓰고
           없으면 시스템 글꼴로 내려간다. */
        font-family: "Pretendard Variable", Pretendard, -apple-system,
          BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
          "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      header {
        padding: 12px 18px 5px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-logo {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        flex: none;
      }
      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.4px;
      }
      #version {
        font-size: 11px;
        font-weight: 500;
        color: var(--tertiary);
        letter-spacing: 0;
      }
      #status {
        margin: 0 18px 2px;
        font-size: 13px;
        color: var(--secondary);
        line-height: 1.35;
      }
      #diagLine {
        margin: 0 18px 10px;
        font-size: 10.5px;
        color: var(--tertiary);
        line-height: 1.35;
      }

      /* ── 한 판 ──────────────────────────────────────────────────────────
         회색 바닥에 카드 넷을 띄우면 "설정 목록" 이 된다. 이건 영상 보다가
         잠깐 여는 도구라 한 판에 담고 실선으로만 나눈다. */
      .panel {
        margin: 10px;
        border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow-card);
        overflow: hidden;
      }

      /* 결과물이 맨 위에 온다. 이 도구가 만드는 게 이것이다. */
      #preview {
        position: relative;
        padding: 26px 16px;
        text-align: center;
        background: #202024
          repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.045) 0 9px,
            transparent 9px 18px
          );
      }
      #previewWrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      #version {
        position: absolute;
        left: 12px;
        bottom: 7px;
        font-size: 10px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.3);
      }

      /* 켜져 있나 · 뭐가 뜨고 있나. 팝업을 여는 이유 그 자체라 제일 크게 둔다. */
      .head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--sep);
      }
      .headText {
        flex: 1;
        min-width: 0;
        border: none;
        background: none;
        padding: 0;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .headTitle {
        display: block;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.3px;
        color: var(--label);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .headSub {
        display: block;
        margin-top: 1px;
        font-size: 12px;
        color: var(--secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 싱크·배속. 같은 일(재생 중 미세 조정)이라 같은 모양으로 둔다. */
      .stepRow {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 14px;
        border-bottom: 1px solid var(--sep);
      }
      .stepRow .k {
        width: 40px;
        flex: none;
        font-size: 14px;
        font-weight: 600;
        color: var(--label);
      }
      .stepRow .v {
        flex: 1;
        text-align: center;
        font-size: 15px;
        font-weight: 700;
        color: var(--label);
        font-variant-numeric: tabular-nums;
      }
      .nub {
        flex: none;
        width: 34px;
        height: 30px;
        border: none;
        border-radius: 9px;
        background: var(--fill);
        color: var(--label);
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .nub:active {
        opacity: 0.5;
      }
      .nub.ghost {
        background: none;
        color: var(--tertiary);
        width: 28px;
      }

      /* 가끔 쓰는 것. 줄 하나씩 내주면 위쪽과 무게가 같아진다. */
      .chips {
        display: flex;
        gap: 7px;
        padding: 11px 14px 13px;
      }
      .chip {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-height: 44px;
        padding: 6px 4px;
        border: none;
        border-radius: 11px;
        background: var(--fill);
        color: var(--label);
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: -0.2px;
        cursor: pointer;
        position: relative;
      }
      .chip:active {
        opacity: 0.55;
      }
      .chip input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }
      .chipVal {
        font-size: 11px;
        font-weight: 600;
        color: var(--secondary);
      }

      /* ── 모양 시트 안의 줄 ──────────────────────────────────────────────
         본문은 한 판(.panel)으로 바뀌었지만 시트 안은 설정 목록 그대로다.
         항목이 열여섯 줄이라 이름·값·조작이 줄지어 서는 편이 읽기 쉽다. */
      .group {
        margin: 0 0 14px;
      }
      .group-title {
        padding: 0 2px 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--secondary);
      }
      .card {
        background: var(--card);
        border-radius: 12px;
        overflow: hidden;
      }
      .row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 6px 13px;
      }
      .row + .row::before {
        content: "";
        position: absolute;
        top: 0;
        left: 13px;
        right: 0;
        height: 1px;
        background: var(--sep);
        transform: scaleY(0.5);
      }
      .row .name {
        flex: none;
        font-size: 14px;
        letter-spacing: -0.2px;
      }
      .row .name.fixed {
        width: 56px;
      }
      .row .name.muted {
        color: var(--secondary);
      }
      .row .spacer {
        flex: 1;
      }
      .row .val {
        flex: none;
        font-size: 13px;
        color: var(--secondary);
        font-variant-numeric: tabular-nums;
        text-align: right;
        min-width: 34px;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row.tap {
        cursor: pointer;
      }
      .row.tap:active {
        background: var(--fill);
      }
      .chev {
        flex: none;
        width: 6px;
        height: 6px;
        border-right: 1.8px solid var(--tertiary);
        border-bottom: 1.8px solid var(--tertiary);
        transform: rotate(-45deg);
      }

      /* ── 바닥 ──────────────────────────────────────────────────────────
         링크 셋과 <details> 를 그냥 흘려 두면 서로 포개진다.
         details 는 블록이라 인라인 링크와 같은 줄에 설 수 없다. */
      .foot {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 0 16px 12px;
      }
      .footRow {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .foot .link {
        border: none;
        background: none;
        padding: 0 10px 0 0;
        font: inherit;
        font-size: 12px;
        color: var(--secondary);
        cursor: pointer;
      }
      .foot .link:hover {
        color: var(--accent);
      }
      .keys {
        margin-top: 8px;
        font-size: 10.5px;
        color: var(--tertiary);
        line-height: 1.4;
      }
      #diagLine {
        margin-top: 4px;
        font-size: 10.5px;
        color: var(--tertiary);
      }

      input[type="checkbox"].switch {
        appearance: none;
        margin: 0;
        flex: none;
        width: 40px;
        height: 24px;
        border-radius: 12px;
        background: var(--fill-strong);
        position: relative;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      input[type="checkbox"].switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--thumb);
        box-shadow: var(--shadow);
        transition: transform 0.2s ease;
      }
      input[type="checkbox"].switch:checked {
        background: var(--green);
      }
      input[type="checkbox"].switch:checked::after {
        transform: translateX(16px);
      }

      input[type="range"] {
        appearance: none;
        flex: 1;
        min-width: 0;
        height: 22px;
        background: transparent;
        margin: 0;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 2px;
        background: var(--fill-strong);
      }
      input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 15px;
        height: 15px;
        margin-top: -6px;
        border-radius: 50%;
        background: var(--thumb);
        box-shadow: var(--shadow), 0 0 0 0.5px rgba(0, 0, 0, 0.06);
      }

      input[type="color"] {
        appearance: none;
        flex: none;
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: none;
        cursor: pointer;
      }
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type="color"]::-webkit-color-swatch {
        border: 1px solid var(--sep);
        border-radius: 50%;
      }

      .btn {
        border: none;
        border-radius: 7px;
        background: var(--fill);
        color: var(--accent);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 5px 8px;
        cursor: pointer;
      }
      .btn:active {
        opacity: 0.5;
      }
      .btn.grow {
        flex: 1;
      }
      .btn-plain {
        width: 100%;
        border: none;
        background: none;
        color: var(--accent);
        font: inherit;
        font-size: 13.5px;
        padding: 11px;
        cursor: pointer;
      }
      .btn-primary {
        display: block;
        width: calc(100% - 28px);
        margin: 2px 14px 14px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px;
        cursor: pointer;
      }
      .btn-primary:disabled {
        opacity: 0.5;
      }

      #preview {
        padding: 9px 10px;
        text-align: center;
        background: #202024
          repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.045) 0 9px,
            transparent 9px 18px
          );
      }
      #previewWrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      #preview div div {
        display: inline-block;
        max-width: 96%;
      }

      .filepick {
        display: block;
        text-align: center;
        color: var(--accent);
        font-size: 13.5px;
        padding: 11px;
        cursor: pointer;
      }
      .filepick input {
        display: none;
      }

      details {
        margin: -6px 18px 12px;
        font-size: 11.5px;
        color: var(--secondary);
      }
      details summary {
        cursor: pointer;
        color: var(--accent);
        font-size: 12px;
        list-style: none;
      }
      details summary::-webkit-details-marker {
        display: none;
      }
      details ul {
        margin: 6px 0 0;
        padding-left: 14px;
        max-height: 110px;
        overflow: auto;
      }
      details li {
        word-break: break-all;
        margin-bottom: 3px;
        color: var(--tertiary);
      }
      .footnote {
        margin: 0 18px;
        font-size: 11px;
        line-height: 1.5;
        color: var(--tertiary);
      }

      /* ---- 시트 ---- */
      #sheet[hidden] {
        display: none;
      }
      #sheet {
        position: fixed;
        inset: 0;
        z-index: 50;
      }
      .sheet-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        animation: fade 0.2s ease;
      }
      .sheet-panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 86%;
        display: flex;
        flex-direction: column;
        background: var(--sheet);
        border-radius: 13px 13px 0 0;
        animation: rise 0.26s cubic-bezier(0.32, 0.72, 0, 1);
        overflow: hidden;
      }
      @keyframes rise {
        from {
          transform: translateY(100%);
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      .sheet-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 13px;
        border-bottom: 1px solid var(--sep);
      }
      .sheet-bar .sheet-title {
        flex: 1;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
      }
      .sheet-bar button {
        border: none;
        background: none;
        color: var(--accent);
        font: inherit;
        font-size: 13.5px;
        cursor: pointer;
        padding: 2px 3px;
      }
      .sheet-bar button.strong {
        font-weight: 600;
      }
      .sheet-body {
        overflow-y: auto;
        padding: 11px 13px 18px;
      }
      /* 좌우 여백은 .sheet-body 가 갖는다. */
      #sheetPanel .group {
        margin: 0 0 14px;
      }
      #sheetPanel .group:last-child {
        margin-bottom: 0;
      }
      /* 되돌리기는 여는 동작이 아니라 되돌리는 동작이다. 파일 열기·후보 요청과
         같은 초록을 쓰면 셋이 같은 무게가 되어 무엇이 주된 행동인지 흐려진다. */
      .name.muted {
        color: var(--secondary);
      }

      .sheet-list {
        background: var(--card);
        border-radius: 11px;
        overflow: hidden;
      }
      .list-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 40px;
        padding: 7px 13px;
        cursor: pointer;
      }
      .list-item:active {
        background: var(--fill);
      }
      .list-item .li-main {
        flex: 1;
        min-width: 0;
      }
      .list-item .li-label {
        font-size: 13.5px;
      }
      .list-item .li-sub {
        margin-top: 1px;
        font-size: 11px;
        color: var(--tertiary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .list-item .li-check {
        flex: none;
        width: 14px;
        color: var(--accent);
        font-size: 14px;
        text-align: right;
        opacity: 0;
      }
      .list-item.on .li-check {
        opacity: 1;
      }
      .list-item .li-order {
        flex: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        line-height: 18px;
        text-align: center;
      }
      .sheet-note {
        padding: 8px 5px 0;
        font-size: 11px;
        line-height: 1.5;
        color: var(--tertiary);
      }
      .sheet-empty {
        padding: 24px 15px;
        text-align: center;
        font-size: 13px;
        color: var(--secondary);
        line-height: 1.6;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <!-- 설정 앱이 아니라 영상 보다가 잠깐 여는 도구다.
         묶음 넷을 회색 바닥에 띄워 두면 "설정 목록" 으로 읽힌다.
         한 판에 담고 실선으로만 나눈다. 자주 쓰는 것(켬끔·트랙·싱크·배속)이
         위쪽 절반을 차지하고, 가끔 쓰는 것은 아래 칩 한 줄로 접는다. -->
    <div class="panel">
      <div id="preview">
        <div id="previewWrap">
          <div id="previewLine1">Sample subtitle text</div>
          <div id="previewLine2">두 번째 언어 미리보기</div>
        </div>
        <span id="version"></span>
      </div>

      <!-- 팝업을 여는 이유 그 자체 — 켜져 있나, 뭐가 뜨고 있나. -->
      <div class="head">
        <input type="checkbox" id="enabled" class="switch" />
        <button class="headText" id="trackRow">
          <span class="headTitle" id="trackValue">없음</span>
          <span class="headSub" id="status">불러오는 중…</span>
        </button>
        <i class="chev"></i>
      </div>

      <div class="stepRow">
        <span class="k">싱크</span>
        <button class="nub" id="syncMinus">−</button>
        <span class="v" id="offsetValue">0.0초</span>
        <button class="nub" id="syncPlus">＋</button>
        <button class="nub ghost" id="syncReset" title="0초로">↺</button>
      </div>

      <div class="stepRow">
        <span class="k">배속</span>
        <button class="nub" id="speedDown">−</button>
        <span class="v" id="speedValue">1.0배</span>
        <button class="nub" id="speedUp">＋</button>
        <button class="nub ghost" id="speedReset" title="1배로">↺</button>
      </div>

      <!-- 가끔 쓰는 것들. 줄 하나씩 내주면 자주 쓰는 것과 무게가 같아진다. -->
      <div class="chips">
        <button class="chip" id="lookRow">글자 모양</button>
        <button class="chip" id="themeRow">
          화면 <span class="chipVal" id="themeValue"></span>
        </button>
        <label class="chip">
          자막 파일
          <input type="file" id="file" accept=".srt,.vtt,.txt,.xml,.ttml,.dfxp" />
        </label>
      </div>
    </div>

    <div class="foot">
      <div class="footRow">
        <button class="link" id="exportRow">.srt 로 저장</button>
        <button class="link" id="resetLookRow">모양 되돌리기</button>
      </div>
      <details id="diag">
        <summary>감지된 자막 후보</summary>
        <ul id="candidates"></ul>
      </details>
      <div id="diagLine"></div>
      <div class="keys">
        Shift+←/→ 싱크 · Shift+↑/↓ 크기 · Shift+,/. 배속 · Alt+드래그 위치
      </div>
    </div>

    <button id="injectBtn" class="btn-primary" style="display: none">
      이 탭에 지금 적용하기
    </button>

    <!-- 모양 묶음 보관함. 시트를 열면 이 안의 내용이 시트로 옮겨 간다. -->
    <div id="lookHost" hidden>
      <div id="lookGroups">
    <div class="group">
      <div class="group-title">글자</div>
      <div class="card">
        <div class="row">
          <span class="name fixed">크기</span>
          <input type="range" id="fontSize" min="10" max="60" step="1" />
          <span class="val" id="fontSizeValue"></span>
        </div>
        <div class="row tap" id="fontRow">
          <span class="name">글꼴</span>
          <span class="spacer"></span>
          <span class="val" id="fontValue"></span>
          <i class="chev"></i>
        </div>
        <div class="row tap" id="weightRow">
          <span class="name">굵기</span>
          <span class="spacer"></span>
          <span class="val" id="weightValue"></span>
          <i class="chev"></i>
        </div>
        <div class="row">
          <span class="name">글자색</span>
          <span class="spacer"></span>
          <span class="val">첫째</span>
          <input type="color" id="fontColor" />
          <span class="val">둘째</span>
          <input type="color" id="fontColor2" />
        </div>
        <div class="row">
          <span class="name fixed">행간</span>
          <input type="range" id="lineHeight" min="100" max="220" step="5" />
          <span class="val" id="lineHeightValue"></span>
        </div>
        <div class="row">
          <span class="name fixed">자간</span>
          <input type="range" id="letterSpacing" min="-10" max="30" step="1" />
          <span class="val" id="letterSpacingValue"></span>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-title">외곽선</div>
      <div class="card">
        <div class="row tap" id="outlineRow">
          <span class="name">종류</span>
          <span class="spacer"></span>
          <span class="val" id="outlineValue"></span>
          <i class="chev"></i>
        </div>
        <div class="row">
          <span class="name fixed">굵기</span>
          <input type="range" id="outlineWidth" min="0" max="6" step="1" />
          <span class="val" id="outlineWidthValue"></span>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-title">배경</div>
      <div class="card">
        <div class="row">
          <span class="name fixed">색</span>
          <input type="color" id="bgColor" />
          <input type="range" id="bgOpacity" min="0" max="100" step="5" />
          <span class="val" id="bgOpacityValue"></span>
        </div>
        <div class="row">
          <span class="name fixed">모서리</span>
          <input type="range" id="bgRadius" min="0" max="20" step="1" />
          <span class="val" id="bgRadiusValue"></span>
        </div>
        <div class="row">
          <span class="name fixed">가로여백</span>
          <input type="range" id="bgPadX" min="0" max="40" step="1" />
          <span class="val" id="bgPadXValue"></span>
        </div>
        <div class="row">
          <span class="name fixed">세로여백</span>
          <input type="range" id="bgPadY" min="0" max="20" step="1" />
          <span class="val" id="bgPadYValue"></span>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-title">배치</div>
      <div class="card">
        <div class="row">
          <span class="name fixed">높이</span>
          <input type="range" id="bottom" min="0" max="80" step="1" />
          <span class="val" id="bottomValue"></span>
        </div>
        <div class="row">
          <span class="name fixed">최대폭</span>
          <input type="range" id="maxWidth" min="30" max="100" step="1" />
          <span class="val" id="maxWidthValue"></span>
        </div>
        <div class="row">
          <span class="name fixed">줄간격</span>
          <input type="range" id="lineGap" min="0" max="24" step="1" />
          <span class="val" id="lineGapValue"></span>
        </div>
        <div class="row" style="padding: 0">
          <button class="btn-plain" id="resetStyle" hidden>모양 기본값으로 되돌리기</button>
        </div>
      </div>
    </div>

      </div>
    </div>

    <div id="sheet" hidden>
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet-panel">
        <div class="sheet-bar">
          <button id="sheetCancel">취소</button>
          <span class="sheet-title" id="sheetTitle"></span>
          <button id="sheetDone" class="strong">완료</button>
        </div>
        <div class="sheet-body">
          <div class="sheet-list" id="sheetList"></div>
          <div class="sheet-note" id="sheetNote"></div>
          <div id="sheetPanel"></div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
